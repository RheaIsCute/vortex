name: Build Windows installer

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build and verify installer
        shell: cmd
        run: build.bat

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VortexSetup
          path: dist_installer/VortexSetup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh release create ${{ github.ref_name }} dist_installer/VortexSetup.exe --title "Vortex ${{ github.ref_name }}" --generate-notes
